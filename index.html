<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Video Quiz Study</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f5f7fa; margin:0; padding:24px; }
  .wrap { max-width: 820px; margin: 0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 10px 25px rgba(0,0,0,.07); }
  h1 { margin:0 0 16px; color:#4f46e5; }
  .row { margin: 12px 0; }
  input[type="text"] { width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:8px; }
  .video-box { margin:16px 0; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  video { width:100%; max-height:520px; background:#000; display:block; }
  .question { font-weight:600; margin:16px 0 10px; }
  .options { display:grid; gap:10px; }
  .option { padding:12px; border:2px solid #e5e7eb; border-radius:8px; cursor:pointer; background:#f9fafb; }
  .option:hover { background:#f3f4f6; }
  .option.selected { background:#4f46e5; color:white; border-color:#4f46e5; }
  .progress { color:#6b7280; margin-top:12px; }
  .actions { margin-top:16px; display:flex; gap:10px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:#4f46e5; color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { background:#c5c5c5; cursor:not-allowed; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Video Quiz Study</h1>

    <div class="row">
      <input id="pid" type="text" placeholder="Participant ID (optional)">
    </div>

    <div class="video-box">
      <video id="video" controls></video>
    </div>

    <div id="question" class="question">What is happening in this video?</div>
    <div id="options" class="options"></div>

    <div class="actions">
      <button id="nextBtn" disabled>Next</button>
    </div>
    <div id="progress" class="progress">Question 1 of 5</div>
  </div>

<script>
// ---- Minimal quiz config ----
const videoBank = [
  { video: "whale_fixed.mp4", correctAnswer: "Swimming" },
  { video: "video2.mp4",      correctAnswer: "A dog running" },
  { video: "video3.mp4",      correctAnswer: "A ball rolling" },
  { video: "video4.mp4",      correctAnswer: "A car driving" },
  { video: "video5.mp4",      correctAnswer: "A person walking" }
];

const allAnswers = [
  "Swimming","A dog running","A ball rolling","A car driving","A person walking",
  "A bird flying","A boat sailing","A child playing","Leaves falling","A person biking"
];

// ---- Basic state ----
const totalQuestions = 5;
let used = new Set();
let idx = 0;
let selected = null;
let responses = [];
let currentTrial = null;

// ---- DOM ----
const $v = document.getElementById("video");
const $q = document.getElementById("question");
const $opts = document.getElementById("options");
const $next = document.getElementById("nextBtn");
const $prog = document.getElementById("progress");
const $pid = document.getElementById("pid");

// ---- helpers ----
function pickTrial() {
  if (used.size === videoBank.length) used.clear();
  let choice;
  do { choice = Math.floor(Math.random()*videoBank.length); } while (used.has(choice));
  used.add(choice);
  const base = videoBank[choice];
  return { ...base, index: choice };
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function genOptions(correct, k=4) {
  const others = allAnswers.filter(x => x !== correct);
  shuffle(others);
  return shuffle([correct, ...others.slice(0, k-1)]);
}

function loadTrial() {
  selected = null;
  currentTrial = pickTrial();
  $v.src = currentTrial.video;
  $v.load();

  $q.textContent = "What is happening in this video?";
  $opts.innerHTML = "";
  const opts = genOptions(currentTrial.correctAnswer, 4);
  opts.forEach(label => {
    const d = document.createElement("div");
    d.className = "option";
    d.textContent = label;
    d.onclick = () => {
      document.querySelectorAll(".option").forEach(n => n.classList.remove("selected"));
      d.classList.add("selected");
      selected = label;
      $next.disabled = false;
    };
    $opts.appendChild(d);
  });

  $next.disabled = true;
  $prog.textContent = `Question ${idx+1} of ${totalQuestions}`;
}

$next.onclick = () => {
  // record
  responses.push({
    trialIndex: idx,
    video: currentTrial.video,
    correctAnswer: currentTrial.correctAnswer,
    participantAnswer: selected,
    isCorrect: selected === currentTrial.correctAnswer,
    ts: new Date().toISOString()
  });

  idx++;
  if (idx < totalQuestions) {
    loadTrial();
  } else {
    (async () => {
      const payload = buildPayload();
      let ok = false;
      try {
        if (window.submitResultsToFirestore) {
          ok = await window.submitResultsToFirestore(payload);
        }
      } catch (e) {
        console.error("Submit failed:", e);
      }

      if (ok) {
        document.querySelector(".wrap").innerHTML = `
          <h1>Thanks!</h1>
          <p>Your responses were submitted successfully. You may close this window.</p>
        `;
      } else {
        document.querySelector(".wrap").innerHTML = `
          <h1>Thanks!</h1>
          <p>Automatic submit failed — please export and send your data.</p>
          <button id="exportJson">Export JSON</button>
          <button id="exportCsv">Export CSV</button>
        `;
        document.getElementById("exportJson").onclick = () => {
          const blob = new Blob([JSON.stringify(buildPayload(), null, 2)], {type:"application/json"});
          const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "study.json" });
          a.click();
        };
        document.getElementById("exportCsv").onclick = () => {
          const rows = responses.map(r => ({
            pid: $pid.value || "",
            trialIndex: r.trialIndex, video: r.video,
            correct: r.correctAnswer, answer: r.participantAnswer,
            isCorrect: r.isCorrect, ts: r.ts
          }));
          const headers = Object.keys(rows[0] || {pid:"",trialIndex:"",video:"",correct:"",answer:"",isCorrect:"",ts:""});
          const csv = [headers.join(",")].concat(rows.map(row => headers.map(h => JSON.stringify(row[h] ?? "").replace(/^"|"$/g,"")).join(","))).join("\n");
          const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([csv],{type:"text/csv"})), download: "study.csv" });
          a.click();
        };
      }
    })();
  }
};

function buildPayload(){
  return {
    pid: $pid.value || `p-${Date.now()}`,
    startedAt: responses[0]?.ts || new Date().toISOString(),
    studyVersion: "v1",
    demo: null,
    responses
  };
}

// init
loadTrial();
</script>

<!-- Firebase (CDN modules) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCWHHhNTLQ9XA53em6byMfVBqn03JqV0fg",
    authDomain: "video-study-1dfc0.firebaseapp.com",
    projectId: "video-study-1dfc0",
    storageBucket: "video-study-1dfc0.firebasestorage.app",
    messagingSenderId: "910625697541",
    appId: "1:910625697541:web:c3764d83f25ddfc16e516c",
    measurementId: "G-0Q1G7JG6ZX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  await signInAnonymously(auth);

  // NEW: saves correctness + a summary
  window.submitResultsToFirestore = async function submitResultsToFirestore(payload) {
    const totalQuestions = payload.responses.length;
    const totalCorrect = payload.responses.filter(r => !!r.isCorrect).length;
    const accuracy = totalQuestions ? totalCorrect / totalQuestions : 0;

    // participant doc with summary fields
    const pRef = await addDoc(collection(db, "participants"), {
      pid: payload.pid,
      startedAt: payload.startedAt,
      studyVersion: payload.studyVersion || "v1",
      demo: payload.demo || null,
      userAgent: navigator.userAgent,
      totalQuestions,
      totalCorrect,
      accuracy,                 // e.g., 0.8
      createdAt: serverTimestamp()
    });

    // one doc per trial — includes correctness fields
    const writes = payload.responses.map(r =>
      addDoc(collection(db, "participants", pRef.id, "responses"), {
        trialIndex: r.trialIndex ?? null,
        trialId: r.trialId || null,
        video: r.video || null,
        participantAnswer: r.participantAnswer ?? null,
        correctAnswer: r.correctAnswer ?? null,
        isCorrect: !!r.isCorrect,
        rt_ms: r.rt_ms ?? null,
        replayUsed: !!r.replayUsed,
        tsClient: r.ts || null,
        createdAt: serverTimestamp()
      })
    );
    await Promise.all(writes);
    return true;
  };
</script>

</body>
</html>
