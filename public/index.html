<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Video Quiz Study</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background:#f5f7fa; margin:0; padding:24px; }
  .wrap { max-width:820px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 10px 25px rgba(0,0,0,.07); }
  h1 { margin:0 0 16px; color:#4f46e5; text-align:center; }
  .row { margin:16px 0; }
  input[type="text"] { width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:8px; }
  .video-box { margin:20px 0; border-radius:8px; overflow:hidden; background:#000; }
  video { width:100%; max-height:480px; display:block; background:#000; }
  .question { font-weight:600; margin:16px 0; }
  .options { display:grid; gap:12px; margin-bottom:16px; }
  .option { padding:12px; border:2px solid #e5e7eb; border-radius:8px; cursor:pointer; background:#f9fafb; }
  .option:hover { background:#f3f4f6; }
  .option.selected { background:#4f46e5; color:white; border-color:#4f46e5; }
  .actions { margin-top:16px; text-align:right; }
  button { padding:10px 16px; border:0; border-radius:8px; background:#4f46e5; color:white; font-weight:600; cursor:pointer; }
  button:disabled { background:#c5c5c5; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Video Quiz Study</h1>
  <div class="row">
    <input id="pid" type="text" placeholder="Participant ID (optional)">
  </div>
  <div class="video-box">
    <video id="video" controls></video>
  </div>
  <div id="question" class="question">What is happening in this video?</div>
  <div id="options" class="options"></div>
  <div class="actions">
    <button id="nextBtn" disabled>Next</button>
  </div>
</div>

<!-- Firebase Setup -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCWHHhNTLQ9XA53em6byMfVBqn03JqV0fg",
    authDomain: "video-study-1dfc0.firebaseapp.com",
    projectId: "video-study-1dfc0",
    storageBucket: "video-study-1dfc0.appspot.com",
    messagingSenderId: "910625697541",
    appId: "1:910625697541:web:c3764d83f25ddfc16e516c",
    measurementId: "G-0Q1G7JG6ZX"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  await signInAnonymously(auth);

  // Firestore submit helper
  window.submitResultsToFirestore = async function(payload) {
    const pRef = await addDoc(collection(db, "participants"), {
      pid: payload.pid,
      startedAt: payload.startedAt,
      userAgent: navigator.userAgent,
      createdAt: serverTimestamp()
    });
    for (const r of payload.responses) {
      await addDoc(collection(db, "participants", pRef.id, "responses"), {
        video: r.video,
        participantAnswer: r.participantAnswer,
        correctAnswer: r.correctAnswer,
        isCorrect: r.isCorrect,
        ts: r.ts,
        createdAt: serverTimestamp()
      });
    }
    return true;
  };
</script>

<!-- Quiz Logic -->
<script>
const videoBank = [
  { video: "videos/banana.mp4", correctAnswer: "banana man" },
  { video: "videos/whale.mp4", correctAnswer: "whale" },
  { video: "videos/dog.mp4", correctAnswer: "dog" }
];
const allAnswers = [
  "Swimming","A dog running","A ball rolling","A car driving","A person walking", "banana man"
];

let idx=0, selected=null, responses=[];
const $v=document.getElementById("video");
const $opts=document.getElementById("options");
const $next=document.getElementById("nextBtn");
const $pid=document.getElementById("pid");

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function loadTrial() {
  selected=null; $next.disabled=true;
  const trial=videoBank[idx];
  $v.src=trial.video; $v.load();
  $opts.innerHTML="";
  const opts=shuffle([trial.correctAnswer,...allAnswers.filter(x=>x!==trial.correctAnswer).slice(0,3)]);
  opts.forEach(label=>{
    const d=document.createElement("div");
    d.className="option"; d.textContent=label;
    d.onclick=()=>{document.querySelectorAll(".option").forEach(n=>n.classList.remove("selected")); d.classList.add("selected"); selected=label; $next.disabled=false;};
    $opts.appendChild(d);
  });
}

$next.onclick=async()=>{
  const trial=videoBank[idx];
  responses.push({
    video: trial.video,
    correctAnswer: trial.correctAnswer,
    participantAnswer: selected,
    isCorrect: selected===trial.correctAnswer,
    ts:new Date().toISOString()
  });
  idx++;
  if(idx<videoBank.length){ loadTrial(); }
  else {
    const payload={pid:$pid.value||`p-${Date.now()}`, startedAt:responses[0]?.ts, responses};
    try {
      await window.submitResultsToFirestore(payload);
      document.querySelector(".wrap").innerHTML="<h1>Thanks!</h1><p>Your responses were submitted.</p>";
    } catch(e) {
      document.querySelector(".wrap").innerHTML="<h1>Thanks!</h1><p>Submission failed. Please send your exported file.</p>";
    }
  }
};

// init
loadTrial();
</script>
</body>
</html>
